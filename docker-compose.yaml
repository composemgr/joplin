# nginx proxy address - http://172.17.0.1:22300

name: joplin
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "5m"
    max-file: "1"

services:
  joplin:
    image: joplin/joplin:latest
    pull_policy: always
    container_name: joplin-app
    restart: always
    logging: *default-logging
    networks:
      - joplin
    ports:
      - "172.17.0.1:22300:22300"
    environment:
      TZ: ${TZ:-America/New_York}
      APP_PORT: 22300
      APP_BASE_URL: http://${BASE_HOST_NAME:-localhost}:22300
      DB_CLIENT: pg
      POSTGRES_HOST: joplin-db
      POSTGRES_PORT: 5432
      POSTGRES_DATABASE: ${DB_CREATE_DATABASE_NAME:-joplin}
      POSTGRES_USER: ${DB_USER_NAME:-joplin}
      POSTGRES_PASSWORD: ${DB_USER_PASS:-changeme_db_password}
    depends_on:
      joplin-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:22300"]
      interval: 30s
      timeout: 10s
      retries: 3

  joplin-db:
    image: postgres:latest
    pull_policy: always
    container_name: joplin-db
    restart: always
    logging: *default-logging
    networks:
      - joplin
    environment:
      TZ: ${TZ:-America/New_York}
      POSTGRES_DB: ${DB_CREATE_DATABASE_NAME:-joplin}
      POSTGRES_USER: ${DB_USER_NAME:-joplin}
      POSTGRES_PASSWORD: ${DB_USER_PASS:-changeme_db_password}
    volumes:
      - ./volumes/data/db/postgres/joplin:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  joplin:
    name: joplin
    external: false
